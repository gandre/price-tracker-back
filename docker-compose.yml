version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: price_tracker_db
    environment:
      POSTGRES_USER: gaston_dev
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: price_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
